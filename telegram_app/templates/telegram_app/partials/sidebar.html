
{% load static %}

<aside class="sidebar">

    <!-- Brand -->
    <div class="brand">
        <div class="brand-icon">J</div>

        <div>
            <h2>JEMI</h2>
            <p>Telegram Dashboard</p>
        </div>
    </div>

    <!-- Navigation -->
    <nav class="sidebar-nav">

        <a href="{% url 'dashboard' %}"
           class="nav-item {% if active_page == 'dashboard' %}active{% endif %}">
            <span class="nav-icon">▦</span>
            <span>Dashboard</span>
        </a>

        <a href="{% url 'conversations' %}"
           class="nav-item {% if active_page == 'conversations' %}active{% endif %}">
            <span class="nav-icon">✉</span>
            <span>Messages</span>
        </a>

        <a href="{% url 'complaints_dashboard' %}"
           class="nav-item {% if active_page == 'complaints' %}active{% endif %}">
            <span class="nav-icon">📋</span>
            <span>Complaints</span>
        </a>

    </nav>

    <!-- Logout -->
    <div class="sidebar-logout">
        <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}

            <button type="submit" class="logout-button">
                <span class="nav-icon">⇥</span>
                <span>Logout</span>
            </button>
        </form>
    </div>

    <!-- WebSocket status -->
    <div class="sidebar-bottom">
        <span class="status-dot" id="connection-dot"></span>
        <span id="connection-status">Connecting...</span>
    </div>

</aside>
